
name: Import internship postings

on:
  schedule:
    - cron: '0 13,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import public postings
        run: python scripts/import_jobs.py

      - name: Commit new postings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update internship postings"
            git push
          fi
