
name: Import internship postings

on:
  schedule:
    - cron: '0 13,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-jobs
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import public postings
        run: python scripts/import_jobs.py
      - name: Commit new postings
        run: |
          if ! git diff --quiet -- data/jobs.json; then
            git config user.name 'internship-hq-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/jobs.json
            git commit -m 'Import new internship postings'
            git push
